name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * *" # daily uptime smoke against production
  workflow_dispatch:

# Least-privilege default: only the deploy job requests an id-token.
permissions:
  contents: read

# One run per branch/ref at a time; superseded runs are cancelled so
# parallel main merges can't race each other on the shared EC2 box.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}     # 123456789012.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: filebrsr-frontend
  BACKEND_REPO: filebrsr-backend
  EC2_HOST: ${{ secrets.EC2_HOST }}              # public EIP of the prod box
  S3_CONFIG_BUCKET: ${{ secrets.S3_CONFIG_BUCKET }}

jobs:
  # Job IDs 'frontend'/'backend' are branch-protection required checks.
  # Don't rename without updating repo Settings -> Branches.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TODO(ratchet): the repo ships 28 pre-existing eslint errors; fix them
      # then drop `continue-on-error` so lint blocks merges.
      - name: Lint (non-blocking until ratchet completes)
        run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # TODO(ratchet): 252 ruff findings + 76 files need formatting; fix then
      # drop `continue-on-error` so lint/format block merges.
      - name: Ruff check (non-blocking until ratchet completes)
        run: ruff check app/
        continue-on-error: true
      - name: Ruff format check (non-blocking until ratchet completes)
        run: ruff format --check app/
        continue-on-error: true
      - run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          SUPABASE_URL: https://example.supabase.co
          # Must match the default in tests/conftest.py — the correction
          # endpoint compares the request bearer to settings.SUPABASE_SERVICE_KEY,
          # and conftest only sets this with os.environ.setdefault() so a
          # different CI value silently breaks TestCorrectionEndpoint with 401s.
          SUPABASE_SERVICE_KEY: test-service-key
          ALLOWED_ORIGINS: http://localhost:3000

  # PR dry-run: prove both Docker images build before merge; scan for
  # known-vulnerable packages. No push, no deploy.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-key-for-build
            NEXT_PUBLIC_API_URL=

      - name: Build backend image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false

      - name: Trivy fs scan (non-blocking; surface findings in the log)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

  # Apply pending SQL migrations to Supabase in version order, before any
  # deploy. Fail-closed: unknown/duplicate version or checksum drift aborts
  # the pipeline so schema and code can't silently diverge.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check SUPABASE_DB_URL is configured
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set; add it before running deploys."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: ./scripts/migrate.sh apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: [frontend, backend, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compute image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # OIDC — no long-lived AWS access keys. Role is terraformed/console-
      # provisioned per this repo; see scripts/aws/oidc-*.json.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: filebrsr-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push frontend (${{ steps.tag.outputs.sha }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ steps.tag.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}

      - name: Build & push backend (${{ steps.tag.outputs.sha }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ steps.tag.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:buildcache,mode=max

      - name: Trivy image scan (non-blocking; surface findings in the log)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Sync runtime config to S3
        run: ./scripts/sync-config.sh
        env:
          S3_CONFIG_BUCKET: ${{ env.S3_CONFIG_BUCKET }}

      - name: Deploy on EC2 (SSM, no SSH key)
        run: ./scripts/ssm-run.sh deploy
        env:
          TAG: ${{ steps.tag.outputs.sha }}
          S3_CONFIG_BUCKET: ${{ env.S3_CONFIG_BUCKET }}

      - name: Post-deploy smoke tests (public https)
        id: smoke
        run: |
          if ! ./scripts/smoke.sh --site https://filebrsr.com; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only smoke failure triggers rollback: deploy.sh already self-rolls on
      # container-health failure, and earlier build/push failures never touch
      # the box, so a broad `if: failure()` would double-roll / wrongly downgrade.
      - name: Rollback to previous tag (smoke failed)
        if: steps.smoke.outputs.failed == 'true'
        run: ./scripts/ssm-run.sh rollback && echo "→ rolled back to previous tag"

      - name: Mark deploy failed
        if: steps.smoke.outputs.failed == 'true'
        run: exit 1

      - name: Tag :stable on success
        if: success()
        run: ./scripts/retag-stable.sh
        env:
          TAG: ${{ steps.tag.outputs.sha }}

      - name: Sentry release (frontend)
        if: success() && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: filebrsr
          SENTRY_PROJECT: filebrsr-frontend
        with:
          environment: production
          version: ${{ steps.tag.outputs.sha }}

      - name: Sentry release (backend)
        if: success() && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: filebrsr
          SENTRY_PROJECT: filebrsr-backend
        with:
          environment: production
          version: ${{ steps.tag.outputs.sha }}

  # External uptime check: hits the real public site every day (and on demand).
  uptime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Smoke production (read-only)
        run: ./scripts/smoke.sh --site https://filebrsr.com --disable-prod-delete