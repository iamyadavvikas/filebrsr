# NOTE: this compose is "pull-only" — images are built in CI and pushed to ECR.
# Required env vars when running on the box (loaded from ~/filebrsr/.env):
#   ECR_REGISTRY   e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com
#   TAG            git short SHA, set by deploy.sh from ~/filebrsr/.current_tag
# Plus all runtime secrets (SUPABASE_*, GEMINI_API_KEY, etc.)

services:
  frontend:
    image: ${ECR_REGISTRY}/filebrsr-frontend:${TAG}
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M

  backend:
    image: ${ECR_REGISTRY}/filebrsr-backend:${TAG}
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_DEFAULT_REGION=ap-south-1
      - ALLOWED_ORIGINS=https://filebrsr.com,https://www.filebrsr.com,http://localhost:3000
      - MAX_FILE_SIZE_MB=50
      - ENVIRONMENT=production
      - SENTRY_DSN=${SENTRY_DSN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=8000
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    image: ${ECR_REGISTRY}/filebrsr-backend:${TAG}
    command: python -m app.worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_DEFAULT_REGION=ap-south-1
      - MAX_FILE_SIZE_MB=50
      - ENVIRONMENT=production
      - SENTRY_DSN=${SENTRY_DSN}
      - RESEND_API_KEY=${RESEND_API_KEY}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
