# Staging overlay: run the prod stack side-by-side for pre-deploy verification.
#
# Usage (on the staging host, or the same box for a smoke check):
#   TAG=<sha> ECR_REGISTRY=<acct>.dkr.ecr.ap-south-1.amazonaws.com \
#     docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     -p filebrsr-staging up -d
#
# Port offsets avoid clashing with production on a shared host:
#   frontend 3001, backend 8001, grafana 3002 (nginx stays prod-only; hit
#   the backend directly or add your own edge).
# The backend health + guest-sandbox loop is the promotion gate:
#   curl localhost:8001/health
#   curl -X POST localhost:8001/api/platform/csrd/guest/session
#
# DNS/host provisioning (dev.filebrsr.com) and secrets remain manual steps —
# see README "Staging runbook".
services:
  frontend:
    ports:
      - "3001:3000"

  backend:
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=staging

  worker:
    environment:
      - ENVIRONMENT=staging

  grafana:
    ports:
      - "3002:3000"
